<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
   <link rel="stylesheet" href="style.css">
    <title>Каталог игр</title>
</head>
<body>
    <h1>StopGame</h1>
    <h2>Фильтры</h2>
    <form action="" method="get">
        <p>
            <label for="search">Название: </label>
            <input class="search" placeholder="Введите название" id="search" type="text" name="search" size="30" required>
        </p>
        <p>
            <label for="platform">Выберите платформу: </label>
            <select id="platform" name="platform">
                <option value="any">Любая</option>
                <option value="pc">PC</option>
                <option value="ps4">PS4</option>
            </select>
        </p>
        <p>
            <fieldset>
                <legend>Жанр</legend>
                <input id="rpg" type="checkbox" name="genre" value="RPG">
                <label for="rpg">RPG</label>
                <input id="racing" type="checkbox" name="genre" value="racing">
                <label for="racing">Гонки</label>
                <input id="quest" type="checkbox" name="genre" value="quest">
                <label for="quest">Квест</label>
            </fieldset>
        </p>
        <input class="submit" type="submit" value="Применить">
    </form>
    <p>

        <table>
            <!-- tr - table row -->
            <!-- td - table data -->
            <!-- th - table header -->
            <tr>
                <th>Ссылка</th>
                <th>Название</th>
                <th>Рейтинг</th>
                <th>Год</th>
            </tr>
            {{DATA}}

</body>
